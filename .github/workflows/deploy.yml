name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Injetar data da última atualização
        run: |
          TS=$(git log -1 --format=%ct)
          MESES=(janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro)
          DIA=$(TZ=America/Sao_Paulo date -u -d "@$TS" +%-d)
          MES_NUM=$(TZ=America/Sao_Paulo date -u -d "@$TS" +%-m)
          ANO=$(TZ=America/Sao_Paulo date -u -d "@$TS" +%Y)
          ISO=$(TZ=America/Sao_Paulo date -u -d "@$TS" +%Y-%m-%d)
          DATA="$DIA de ${MESES[$((MES_NUM-1))]} de $ANO"
          echo "Data de atualização: $DATA"
          sed -i "s/{{UPDATED_AT}}/$DATA/g; s/{{UPDATED_AT_ISO}}/$ISO/g; s/{{YEAR}}/$ANO/g" index.html
          grep -q "{{" index.html && { echo "Placeholder não substituído:"; grep -o "{{[A-Z_]*}}" index.html; exit 1; } || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
